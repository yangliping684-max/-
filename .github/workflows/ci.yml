name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["data/**"]

permissions:
  contents: read

jobs:
  engine:
    name: Engine tests & config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e "./engine[dev]"
      - name: Validate config/*.json
        run: python -m changeradar validate
      - name: Unit tests (offline fixtures, no network)
        run: python -m pytest engine

  web:
    name: Web typecheck, tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
