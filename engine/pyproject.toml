[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "changeradar"
version = "0.1.0"
description = "知更 ChangeRadar monitoring engine: fetch, parse, diff, dedup, score and notify."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.27,<1",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "feedparser>=6.0.11",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[project.scripts]
changeradar = "changeradar.cli:main"

[tool.setuptools.packages.find]
include = ["changeradar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
